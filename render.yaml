services:
  - type: web
    name: precision-car-rentals
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && cd ../client && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PAYMENT_MODE
        value: mock
      - key: SMS_MODE
        value: mock
      - key: EMAIL_MODE
        value: mock
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@precisioncarrentals.us
      - key: ADMIN_PASSWORD
        value: changeme123
      - key: BUSINESS_NAME
        value: Precision Car Rentals
      - key: BUSINESS_PHONE
        value: "+17046481760"
      - key: PUBLIC_URL
        sync: false
